name: Build & Release APK

# Required Repository Secrets:
# - RELEASE_KEYSTORE_BASE64: Base64-encoded release keystore (.jks/.keystore file)
# - RELEASE_KEYSTORE_PASSWORD: Password for the keystore
# - RELEASE_KEY_ALIAS: Alias of the signing key
# - RELEASE_KEY_PASSWORD: Password for the signing key

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd7190088b1c0a033501a4e613f360981b1626 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintRelease --stacktrace

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.keystore"

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Release Artifacts & Notes
        id: prepare_release
        run: |
          VERSION_TAG="v1.0.${{ github.run_number }}"
          echo "tag_name=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          
          # Rename APK to a clean user-friendly filename
          APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
          APK_TARGET="app/build/outputs/apk/release/GboardRGBStudio-${VERSION_TAG}.apk"
          cp "$APK_SOURCE" "$APK_TARGET"
          echo "apk_path=$APK_TARGET" >> "$GITHUB_OUTPUT"

          # Extract commit subject and body
          COMMIT_HASH=$(git log -1 --pretty=format:"%h")
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")

          cat << 'EOF' > release_notes.md
          ## ⌨️ Gboard RGB Studio Release
          
          ### 📝 Commit Notes & Changes:
          ```
          EOF
          git log -1 --pretty=format:"%B" >> release_notes.md
          cat << EOF >> release_notes.md
          \`\`\`
          
          ---
          
          ### 📌 Build Details:
          - **Commit:** ${COMMIT_HASH} by **${COMMIT_AUTHOR}**
          - **Release Tag:** ${VERSION_TAG}
          - **Compiled with:** JDK 21 / Android Gradle Plugin 9.1.1
          
          ### 🚀 Quick Installation:
          1. Download \`GboardRGBStudio-${VERSION_TAG}.apk\` attached below.
          2. Install or update the APK on your rooted Android device.
          3. Ensure the module is enabled in **LSPosed** with **Gboard** in its scope.
          4. Enjoy fluid RGB waves, 8 effect presets, and zero-restart live customization!
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.prepare_release.outputs.tag_name }}
          name: "Gboard RGB Studio ${{ steps.prepare_release.outputs.tag_name }}"
          body_path: release_notes.md
          files: ${{ steps.prepare_release.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
